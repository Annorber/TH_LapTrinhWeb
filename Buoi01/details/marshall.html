<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marshall Stanmore III - Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-Shop sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="../index.html"><div class="brand-avatar me-2"><i class="bi bi-bag-fill"></i></div>SHOP</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row bg-white p-4 rounded shadow-sm">
            <div class="col-md-5">
                <img src="../images/marshall_speaker.png" class="img-fluid rounded border" alt="Marshall Speaker">
            </div>
            <div class="col-md-7">
                <h4 class="fw-bold mb-3">Loa Bluetooth Marshall Stanmore III - Chính hãng phân phối</h4>
                <div class="bg-light p-3 mb-4 rounded">
                    <h3 class="text-danger fw-bold m-0">₫9.290.000</h3>
                </div>
                <div class="mb-4">
                    <p class="mb-1"><i class="bi bi-truck me-2 text-success"></i> Miễn phí vận chuyển</p>
                    <p class="text-muted small">Xử lý bởi Shop</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-danger btn-lg px-4" style="border-color: var(--Shop-orange); color: var(--Shop-orange);">
                        <i class="bi bi-cart-plus me-2"></i> Thêm vào giỏ
                    </button>
                    <button class="btn btn-Shop btn-lg px-5">Mua ngay</button>
                </div>
                <hr>
                <a href="../index.html" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> Quay lại Shop</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
